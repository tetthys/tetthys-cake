[package]
name = "tetthys-cake"
version = "0.1.0"
edition = "2021"

description = "cake for rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tetthys/tetthys-cake"

[lib]
name = "tetthys_cake"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
axum = "0.7"
http = "1"
inventory = "0.3"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
